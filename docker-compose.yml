version: "3.7"
services:
  postgres:
    # Image có cả PostGIS và TimescaleDB (đã gộp về 1 database)
    image: parjom/timescaledb-postgis:2.17.2-pg16-postgis350
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=fieldkit
      - POSTGRES_USER=fieldkit
      - POSTGRES_PASSWORD=password
    volumes:
      - ./.db:/var/lib/postgresql/data
      - ./active-schema:/docker-entrypoint-initdb.d/:ro

  # tsdb service đã không còn cần thiết vì đã gộp về 1 database
